<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Synthetic noon-conference attendance</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; }
    body { max-width: 820px; margin: 40px auto; padding: 0 24px; color: #281241; background: #faf9f7; }
    h1 { color: #5f277e; }
    .notice { font-weight: 700; color: #003da6; }
    .chart { display: flex; align-items: end; gap: 14px; min-height: 320px; margin: 28px 0; border-bottom: 3px solid #281241; }
    .week { flex: 1; text-align: center; }
    .bar { height: calc(var(--count) * 10px); min-height: 20px; background: #00a99d; border-radius: 8px 8px 0 0; color: #281241; display: flex; align-items: start; justify-content: center; padding-top: 8px; font-weight: 700; transition: background .15s, transform .15s; }
    .bar.highlight { background: #ff4d00; transform: translateY(-8px); }
    label { font-weight: 700; }
    input { width: 5rem; margin: 0 10px; padding: 7px; font: inherit; }
    #status { margin-top: 12px; min-height: 1.4em; }
  </style>
</head>
<body>
  <p class="notice">SYNTHETIC COUNTS — NOT REAL RESIDENT DATA</p>
  <h1>Noon-conference attendance</h1>
  <div class="chart" aria-label="Attendance counts for eight synthetic weeks">
    <div class="week"><div class="bar" data-week="1" style="--count:19">19</div><p>1</p></div>
    <div class="week"><div class="bar" data-week="2" style="--count:22">22</div><p>2</p></div>
    <div class="week"><div class="bar" data-week="3" style="--count:17">17</div><p>3</p></div>
    <div class="week"><div class="bar" data-week="4" style="--count:25">25</div><p>4</p></div>
    <div class="week"><div class="bar" data-week="5" style="--count:23">23</div><p>5</p></div>
    <div class="week"><div class="bar" data-week="6" style="--count:20">20</div><p>6</p></div>
    <div class="week"><div class="bar" data-week="7" style="--count:26">26</div><p>7</p></div>
    <div class="week"><div class="bar" data-week="8" style="--count:24">24</div><p>8</p></div>
  </div>
  <label for="weekInput">Highlight week</label>
  <input id="weekInput" type="number" min="1" max="8" inputmode="numeric">
  <div id="status"></div>
  <script>
    const weekInput = document.getElementById('weekPicker');
    const status = document.getElementById('status');
    const bars = [...document.querySelectorAll('.bar')];

    weekInput.addEventListener('input', () => {
      const selected = Number(weekInput.value);
      bars.forEach((bar) => bar.classList.toggle('highlight', Number(bar.dataset.week) === selected));
      const match = bars.find((bar) => Number(bar.dataset.week) === selected);
      status.textContent = match ? `Week ${selected}: ${match.textContent} attendees.` : 'Enter a week from 1 to 8.';
    });
  </script>
</body>
</html>
